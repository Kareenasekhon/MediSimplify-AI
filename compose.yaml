name: medisimplify-ai

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ENV: docker
      TESSERACT_CMD: /usr/bin/tesseract
      HF_HOME: /home/appuser/.cache/huggingface
      # Ollama runs on the Windows host. Set OLLAMA_ENABLED=true in backend/.env when needed.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - backend_temp:/app/temporary_data
      - huggingface_cache:/home/appuser/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      - frontend_history:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  backend_temp:
  huggingface_cache:
  frontend_history:
